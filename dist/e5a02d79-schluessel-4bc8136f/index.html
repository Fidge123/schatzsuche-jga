        <div class="content">
          <h1>Der eiserne Bart</h1>
          <p class="lead">Ich habe Zähne, doch beiße ich nie. Dreht man mich richtig, öffne ich sie.</p>
          <section class="question" aria-labelledby="frage-4">
            <h2 id="frage-4">Eure Aufgabe</h2>
            <p>Welcher Gegenstand ist gemeint?</p>
          </section>
          <details>
            <summary>Tipp anzeigen</summary>
            <p>Man trägt mich oft an einem Ring.</p>
          </details>
          <p class="next-step"><span aria-hidden="true">✦</span> Sucht in der Nähe nach meinem goldenen Abbild und merkt euch die Zahl daneben.</p>
