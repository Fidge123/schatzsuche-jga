<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173f35">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Druckbogen mit den QR-Codes aller Stationen">
    <title>QR-Codes drucken · Schatzsuche</title>
    <link rel="stylesheet" href="../assets/site.css">
  </head>
  <body>
    <main>
      <section class="print-sheet">
        <header>
          <h1>QR-Codes der Schatzsuche</h1>
          <p>Alle fünf Stationen auf einem A4-Druckbogen. Vor dem Verteilen jeden Code einmal testen.</p>
          <button class="print-action" type="button" onclick="window.print()">Druckbogen drucken</button>
        </header>
        <div class="qr-grid">
          <figure class="qr-card" data-url="https://fidge123.github.io/schatzsuche-jga/7f3a9c2e/">
              <img class="qr-code" src="../assets/qr-1.svg" alt="QR-Code für Station 1" width="512" height="512">
              <figcaption>
                <h2>Station 1</h2>
                <p>https://fidge123.github.io/schatzsuche-jga/7f3a9c2e/</p>
              </figcaption>
            </figure><figure class="qr-card" data-url="https://fidge123.github.io/schatzsuche-jga/b84d1f6a/">
              <img class="qr-code" src="../assets/qr-2.svg" alt="QR-Code für Station 2" width="512" height="512">
              <figcaption>
                <h2>Station 2</h2>
                <p>https://fidge123.github.io/schatzsuche-jga/b84d1f6a/</p>
              </figcaption>
            </figure><figure class="qr-card" data-url="https://fidge123.github.io/schatzsuche-jga/2c91e7bd/">
              <img class="qr-code" src="../assets/qr-3.svg" alt="QR-Code für Station 3" width="512" height="512">
              <figcaption>
                <h2>Station 3</h2>
                <p>https://fidge123.github.io/schatzsuche-jga/2c91e7bd/</p>
              </figcaption>
            </figure><figure class="qr-card" data-url="https://fidge123.github.io/schatzsuche-jga/e5a02d79/">
              <img class="qr-code" src="../assets/qr-4.svg" alt="QR-Code für Station 4" width="512" height="512">
              <figcaption>
                <h2>Station 4</h2>
                <p>https://fidge123.github.io/schatzsuche-jga/e5a02d79/</p>
              </figcaption>
            </figure><figure class="qr-card" data-url="https://fidge123.github.io/schatzsuche-jga/93ce4a71/">
              <img class="qr-code" src="../assets/qr-5.svg" alt="QR-Code für Station 5" width="512" height="512">
              <figcaption>
                <h2>Station 5</h2>
                <p>https://fidge123.github.io/schatzsuche-jga/93ce4a71/</p>
              </figcaption>
            </figure>
        </div>
      </section></main>
  </body>
</html>
